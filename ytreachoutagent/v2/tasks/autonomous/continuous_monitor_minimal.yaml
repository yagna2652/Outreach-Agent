name: Minimal Monitor
description: Absolutely minimal monitor for testing

input_schema:
  type: object
  properties:
    spreadsheet_id:
      type: string
    google_auth_token:
      type: string
    apify_token:
      type: string
  required:
    - spreadsheet_id
    - google_auth_token

tools: []

main:
  # Step 1: Read Google Sheets data
  - tool: http_request
    arguments:
      method: GET
      url: https://sheets.googleapis.com/v4/spreadsheets/${ steps[0].input.spreadsheet_id }/values/A1:F5
      headers:
        Authorization: Bearer ${ steps[0].input.google_auth_token }

  # Step 2: Return the response
  - return: "Task completed successfully"