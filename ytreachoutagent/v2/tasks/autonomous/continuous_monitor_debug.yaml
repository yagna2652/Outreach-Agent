name: Debug Continuous Monitor
description: Simplified monitor for debugging execution errors

input_schema:
  type: object
  properties:
    spreadsheet_id:
      type: string
    google_auth_token:
      type: string
    apify_token:
      type: string
  required:
    - spreadsheet_id
    - google_auth_token
    - apify_token

tools: []

main:
  # Step 1: Log start
  - log: Starting continuous monitor debug task

  # Step 2: Read Google Sheets data
  - tool: http_request
    arguments:
      method: GET
      url: https://sheets.googleapis.com/v4/spreadsheets/${ steps[0].input.spreadsheet_id }/values/A1:F10
      headers:
        Authorization: Bearer ${ steps[0].input.google_auth_token }

  # Step 3: Log the raw response
  - log: "HTTP Response received"

  # Step 4: Parse and log sheet data
  - evaluate:
      has_output: ${ steps[2].output is not None }

  - log: "Has output: ${ _.has_output }"

  # Step 5: Try to extract values
  - if: ${ _.has_output }
    then:
      evaluate:
        sheet_values: ${ steps[2].output.get('values', []) if hasattr(steps[2].output, 'get') else [] }
    else:
      evaluate:
        sheet_values: []

  # Step 6: Log result
  - log: "Number of rows found: ${ len(_.sheet_values) }"

  # Step 7: Return simple result
  - return:
      success: true
      rows_found: ${ len(_.sheet_values) }
      debug_info: "Task completed"