name: Continuous YouTube Monitor with MCP
description: Autonomously monitors YouTube videos using MCP integrations

input_schema:
  type: object
  properties:
    mode:
      type: string
      enum: [continuous, once]
      default: once
    spreadsheet_id:
      type: string
    google_auth_token:
      type: string
    apify_token:
      type: string
    max_videos_per_run:
      type: integer
      default: 1
    send_emails:
      type: boolean
      default: false
    process_video_task_id:
      type: string
      description: Task ID for the process_single_video_mcp task
      default: "068f375f-0c17-7203-8000-21cf68503505"
  required:
    - spreadsheet_id
    - google_auth_token
    - apify_token

tools: []

main:
  # Step 1: Read Google Sheets data
  - tool: http_request
    arguments:
      method: GET
      url: https://sheets.googleapis.com/v4/spreadsheets/${ steps[0].input.spreadsheet_id }/values/A1:F100
      headers:
        Authorization: Bearer ${ steps[0].input.google_auth_token }

  # Step 2: Parse sheet data
  - evaluate:
      sheet_data: ${ steps[0].output.values if steps[0].output and steps[0].output.values else [] }
      data_rows: ${ _.sheet_data[1:] if len(_.sheet_data) > 1 else [] }

  # Step 3: Find first pending video
  - evaluate:
      first_pending: |
        next((
          {
            'row_number': idx + 2,
            'creator_name': row[0] if len(row) > 0 else '',
            'youtube_url': row[1] if len(row) > 1 else '',
            'email': row[2] if len(row) > 2 else '',
            'status': row[3] if len(row) > 3 else ''
          }
          for idx, row in enumerate(_.data_rows)
          if len(row) > 1
          and row[1]
          and (len(row) < 4 or row[3].lower() in ['pending', ''])
        ), None)

  # Step 4: Process video if found
  - if: ${ _.first_pending is not None }
    then:
      tool: system_call
      arguments:
        task_id: ${ steps[0].input.process_video_task_id }
        input:
          creator_name: ${ _.first_pending['creator_name'] }
          youtube_url: ${ _.first_pending['youtube_url'] }
          email: ${ _.first_pending['email'] }
          row_number: ${ _.first_pending['row_number'] }
          apify_token: ${ steps[0].input.apify_token }
          google_auth_token: ${ steps[0].input.google_auth_token }
          spreadsheet_id: ${ steps[0].input.spreadsheet_id }
          send_email: ${ steps[0].input.send_emails }
    else:
      log: No pending videos found

  # Step 5: Return results
  - return:
      mode: ${ steps[0].input.mode }
      video_processed: ${ _.first_pending is not None }
      processed_url: ${ _.first_pending['youtube_url'] if _.first_pending is not None else None }