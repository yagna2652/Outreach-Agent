name: Test API Simple
description: Simplest possible API test

input_schema:
  type: object
  properties:
    spreadsheet_id:
      type: string
    google_auth_token:
      type: string
  required:
    - spreadsheet_id
    - google_auth_token

tools:
  - name: http_get
    type: api_call
    description: Make HTTP GET request
    api_call:
      method: GET
      url: "https://sheets.googleapis.com/v4/spreadsheets"

main:
  # Step 1: Make API call with path segments
  - tool: http_get
    arguments:
      path: "${ '/' + steps[0].input.spreadsheet_id + '/values/A1:B2' }"
      headers:
        Authorization: "${ 'Bearer ' + steps[0].input.google_auth_token }"

  # Step 2: Return result
  - return:
      response: ${ steps[1] }