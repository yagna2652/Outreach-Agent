name: Test Google API
description: Simple test of Google Sheets API call

input_schema:
  type: object
  properties:
    spreadsheet_id:
      type: string
    google_auth_token:
      type: string
  required:
    - spreadsheet_id
    - google_auth_token

tools:
  - name: google_sheets_read
    type: api_call
    description: Read from Google Sheets
    api_call:
      method: GET
      url: "https://sheets.googleapis.com/v4/spreadsheets/{{spreadsheet_id}}/values/{{range}}"
      headers:
        Authorization: "Bearer {{token}}"

main:
  # Step 1: Make API call with direct parameter substitution
  - tool: google_sheets_read
    arguments:
      spreadsheet_id: "${ steps[0].input.spreadsheet_id }"
      range: "A1:B2"
      token: "${ steps[0].input.google_auth_token }"

  # Step 2: Return result
  - return:
      response: ${ steps[1].output if steps[1].output else 'No output' }