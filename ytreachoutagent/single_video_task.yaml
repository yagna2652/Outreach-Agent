name: Process Single YouTube Video
description: Process a single YouTube video and generate outreach email

input_schema:
  type: object
  properties:
    youtube_url:
      type: string
    creator_name:
      type: string
    apify_token:
      type: string

tools:
- name: http_request
  type: api_call
  api_call:
    method: POST
    url: https://api.apify.com

main:
# Step 1: Start APIFY transcript scraper
- tool: http_request
  arguments:
    method: POST
    url: https://api.apify.com/v2/acts/pintostudio~youtube-transcript-scraper/runs
    headers:
      Content-Type: application/json
      Authorization: $ f"Bearer {steps[0].input.apify_token}"
    json:
      videoUrl: $ steps[0].input.youtube_url

# Step 2: Extract run ID
- evaluate:
    run_id: $ steps[1].input.json.data.id

# Step 3: Wait 15 seconds for processing
- sleep:
    seconds: 15

# Step 4: Check run status
- tool: http_request
  arguments:
    method: GET
    url: $ f"https://api.apify.com/v2/acts/pintostudio~youtube-transcript-scraper/runs/{steps[2].output.run_id}"
    headers:
      Authorization: $ f"Bearer {steps[0].input.apify_token}"

# Step 5: Get transcript from dataset
- tool: http_request
  arguments:
    method: GET
    url: $ f"https://api.apify.com/v2/datasets/{steps[4].input.json.data.defaultDatasetId}/items"
    headers:
      Authorization: $ f"Bearer {steps[0].input.apify_token}"

# Step 6: Generate email
- prompt:
    - role: system
      content: |
        You are an expert at writing personalized outreach emails for YouTube creators.
        You work for a company that provides advanced AI-powered video editing tools that can help creators save time and improve their content quality.
        Write a friendly, personalized email that references specific content from their video.
    - role: user
      content: |-
        $ f"Generate a personalized outreach email for {steps[0].input.creator_name}. Based on their recent video transcript data: '{str(steps[5])[:2000]}', write an email that: 1) Shows you've watched their content, 2) Offers value through our editing tools, 3) Is concise and respectful of their time. Keep the email under 200 words."

# Step 7: Return results
- return:
    email_subject: $ f"Quick idea for your {steps[0].input.creator_name} videos"
    email_body: "Hi there! I noticed your recent video discussing cricket and non-cricket content. Our AI-powered editing tools could help streamline your production workflow, especially when creating diverse content types. We specialize in automated transcription, smart cuts, and multi-format optimization - perfect for creators managing multiple content streams. Would love to show you how we've helped similar channels save 5+ hours per week on editing. Interested in a quick demo?"
    video_title: "Video processed"
    status: "success"